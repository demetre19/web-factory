<meta charset="utf-8">

<title>tech_ornament — variant proof</title>
<style>
  :root {
    --bg: #F7F5F2; --surface: #FFFFFF; --ink: #26221D;
    --muted: #6E675E; --line: #E5E0D8;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 32px;
  }
  h1 { font-size: 18px; font-weight: 600; }
  p.sub { color: var(--muted); margin: 6px 0 28px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(680px, 1fr));
    gap: 28px;
  }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .surf {
    position: relative;
    width: 640px; height: 400px; max-width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  /* the contract: ornament layer is absolute, z-below, inert */
  .surf .orn {
    position: absolute; inset: 0;
    z-index: 0; pointer-events: none;
    color: var(--ink);          /* currentColor demo */
  }
  .probe {
    position: absolute; z-index: 1;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: var(--muted); font-size: 11px; letter-spacing: .04em;
    background: color-mix(in oklch, var(--surface) 80%, transparent);
    padding: 2px 8px; border-radius: 4px;
  }
  figcaption { display: flex; justify-content: space-between;
               color: var(--muted); font-size: 12px; }
  figcaption b { color: var(--ink); font-weight: 600; }
</style>
</head>
