<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: line-mask-entrance — masked headline rise</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
/* --- recipe ----------------------------------------------------------
   Each headline line sits in an overflow:hidden mask. The inner span
   starts translateY(115%) and slides up into view — text seems to rise
   out of a slot. Load trigger + --d stagger per line. */
.h{font:600 clamp(2rem,6vw,3.4rem)/1.05 system-ui;text-align:center}
.mask{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.mask>span{display:block;transform:translateY(115%);
  transition:transform 1.1s var(--ease-out);transition-delay:var(--d,0s)}
.lines-in .mask>span{transform:none}
.mask em{font-style:normal;color:var(--accent)}
@media (prefers-reduced-motion:reduce){
  .mask>span{transform:none;transition:none}
}
/* --------------------------------------------------------------------- */
button{margin-top:24px;padding:.5em 1.2em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;font:inherit}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="const d=document.documentElement,e=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=e==='dark'?'light':'dark'">light / dark</button>
<div>
  <h1 class="h" id="h1">
    <span class="mask"><span>Machines do the work.</span></span>
    <span class="mask" style="--d:120ms"><span><em>50+ years</em> do the thinking.</span></span>
  </h1>
  <div style="text-align:center"><button id="replay">replay</button></div>
</div>
<script>
addEventListener('message',e=>{if(e.data&&e.data.motionTheme)document.documentElement.dataset.theme=e.data.motionTheme});
// recipe JS — one class on load (rAF so transition paints), replay hook
requestAnimationFrame(() => document.getElementById('h1').classList.add('lines-in'));
document.getElementById('replay').onclick = () => {
  const h = document.getElementById('h1');
  h.classList.remove('lines-in'); void h.offsetHeight; h.classList.add('lines-in');
};
</script>
</body>
</html>
