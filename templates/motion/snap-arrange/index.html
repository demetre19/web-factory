<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: snap-arrange — scatter-to-grid loop</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-soft:cubic-bezier(.33,1,.68,1);--pass:8s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
svg{width:150px;height:150px}
/* --- recipe ----------------------------------------------------------
   Each piece carries its scattered pose in --sx/--sy/--sr; the shared
   keyframes pull them to identity (the grid) then scatter again — a
   "layout finds its order" loop, ease-both because travel is on-screen. */
.sa .frame{fill:none;stroke:var(--ink);stroke-width:1.5}
.sa .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.sa .tile{fill:var(--line);stroke:var(--ink);stroke-width:1.2;
  transform-box:fill-box;
  animation:sa var(--pass) var(--ease-soft) infinite;
  animation-delay:calc(var(--o,0)*.25s)}
.sa .tile.hot{fill:var(--accent);fill-opacity:.55}
@keyframes sa{
  0%,10%{transform:translate(var(--sx,0),var(--sy,0)) rotate(var(--sr,0))}
  24%,86%{transform:none}
  100%{transform:translate(var(--sx,0),var(--sy,0)) rotate(var(--sr,0))}}
@media (prefers-reduced-motion:reduce){.sa .tile{animation:none;transform:none}}
/* --------------------------------------------------------------------- */
small{display:block;margin-top:14px;color:var(--muted);text-align:center}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div>
<svg class="sa" viewBox="0 0 120 120" aria-hidden="true">
  <rect class="frame" x="34" y="24" width="72" height="66" rx="4"/>
  <path class="guide" d="M58 28v58 M82 28v58"/>
  <rect class="tile hot" x="40" y="32" width="18" height="18" rx="2" style="--sx:-14px;--sy:-10px;--sr:-14deg;--o:0"/>
  <rect class="tile" x="64" y="32" width="18" height="18" rx="2" style="--sx:10px;--sy:-16px;--sr:10deg;--o:1"/>
  <rect class="tile" x="88" y="32" width="14" height="18" rx="2" style="--sx:14px;--sy:8px;--sr:18deg;--o:2"/>
  <rect class="tile" x="40" y="58" width="38" height="24" rx="2" style="--sx:-12px;--sy:14px;--sr:8deg;--o:1"/>
  <rect class="tile" x="82" y="58" width="20" height="24" rx="2" style="--sx:16px;--sy:-6px;--sr:-12deg;--o:0"/>
</svg>
<small>tiles scatter then snap into the grid — 8 s loop</small>
</div>
</body>
</html>
