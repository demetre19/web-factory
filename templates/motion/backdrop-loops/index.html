<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: backdrop-loops — ambient rotate + dash-flow SVGs</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;gap:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.panel{position:relative;width:min(420px,88vw);height:220px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card,transparent)}
.panel p{position:absolute;margin:0;left:18px;bottom:14px;color:var(--muted);font-size:12px}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
/* --- recipe ----------------------------------------------------------
   Two licensed ambient loops: (a) whole-group rotation around a fixed
   view-box origin — transform-box:view-box is required; (b) marching
   dashes along paths — dashoffset to a multiple of the dash period so
   the wrap is seamless. Linear + very long periods = calm, not machinery. */
.bl-rotate .dial{transform-box:view-box;transform-origin:210px 110px;
  animation:bl-turn 60s linear infinite}
.bl-rotate .dial-2{transform-box:view-box;transform-origin:210px 110px;
  animation:bl-turn 240s linear infinite reverse}
@keyframes bl-turn{to{transform:rotate(360deg)}}
.bl-flow path{fill:none;stroke:var(--muted);stroke-width:1.5;
  stroke-dasharray:6 14;
  animation:bl-flow 12s linear infinite}
@keyframes bl-flow{to{stroke-dashoffset:-160px}} /* 160 = 8 * (6+14): seamless */
@media (prefers-reduced-motion:reduce){.bl-rotate *,.bl-flow path{animation:none!important}}
/* --------------------------------------------------------------------- */
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div class="row">
  <div class="panel">
    <svg class="bl-rotate" viewBox="0 0 420 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g class="dial" fill="none" stroke="var(--muted)" stroke-width="1">
        <circle cx="210" cy="110" r="150" stroke-dasharray="2 10"/>
        <path d="M210-40v16 M330-10l-8 14 M390 110h-16 M330 230l-8-14 M210 260v-16 M90 230l8-14 M30 110h16 M90-10l8 14" stroke-width="1.5"/>
      </g>
      <g class="dial-2" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".6">
        <circle cx="210" cy="110" r="90" stroke-dasharray="3 8"/>
      </g>
    </svg>
    <p>dial rotation — 60 s + 240 s counter-rotate</p>
  </div>
  <div class="panel">
    <svg class="bl-flow" viewBox="0 0 420 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M-20 110 C 120 110, 130 30, 260 30"/>
      <path d="M-20 110 C 120 110, 130 80, 260 80"/>
      <path d="M-20 110 C 120 110, 130 140, 260 140"/>
      <path d="M-20 110 C 120 110, 130 190, 260 190"/>
      <path d="M-20 110 C 120 110, 130 55, 300 55"/>
      <path d="M-20 110 C 120 110, 130 165, 300 165"/>
    </svg>
    <p>lane dash-flow — 12 s marching dashes</p>
  </div>
</div>
</body>
</html>
