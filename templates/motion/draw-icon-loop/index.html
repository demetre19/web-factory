<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: draw-icon-loop — looping line-draw cycle</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);--pass:6s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
svg{width:140px;height:140px}
/* --- recipe ----------------------------------------------------------
   One shared --pass timeline; percentage windows give each element an
   "act" then a reset. --o staggers elements inside the same keyframes. */
.dl .house{fill:none;stroke:var(--ink);stroke-width:1.5;opacity:.5;
  animation:dl-house var(--pass) var(--ease-out) infinite}
.dl .draw{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1px;
  animation:dl-draw var(--pass) var(--ease-out) infinite;
  animation-delay:calc(var(--o,0)*.16s)}
@keyframes dl-house{0%,56%,100%{stroke:var(--ink);opacity:.5}8%,44%{stroke:var(--accent);opacity:1}}
@keyframes dl-draw{0%,56%,100%{stroke-dashoffset:1px}10%,44%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .dl *{animation:none!important}
  .dl .draw{stroke-dashoffset:0}
}
/* --------------------------------------------------------------------- */
small{display:block;margin-top:14px;color:var(--muted);text-align:center}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="const d=document.documentElement,e=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=e==='dark'?'light':'dark'">light / dark</button>
<div>
<svg class="dl" viewBox="0 0 112 112" aria-hidden="true">
  <circle class="house" cx="56" cy="56" r="50"/>
  <path class="draw" pathLength="1" d="M32 42h48"/>
  <path class="draw" pathLength="1" d="M32 56h38" style="--o:1"/>
  <path class="draw" pathLength="1" d="M32 70h26" style="--o:2"/>
</svg>
<small>lines draw in, hold, erase — 6 s loop, pure CSS</small>
</div>
<script>addEventListener('message',e=>{if(e.data&&e.data.motionTheme)document.documentElement.dataset.theme=e.data.motionTheme})</script>
</body>
</html>
