<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: axis-grow — staggered scaleX bars</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);--pass:6s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
svg{width:140px;height:140px}
/* --- recipe ----------------------------------------------------------
   Axis growth = scaleX from a fixed edge. transform-origin "0 center"
   + transform-box:fill-box anchors the left edge. The "professional"
   personality's signature move — growth with no overshoot. */
.ag .rail{stroke:var(--ink);opacity:.18;stroke-width:1.5}
.ag .bar{fill:var(--accent);transform-box:fill-box;transform-origin:0 50%;
  transform:scaleX(0);
  animation:ag-bar var(--pass) var(--ease-out) infinite;
  animation-delay:calc(var(--o,0)*.2s)}
@keyframes ag-bar{0%,56%,100%{transform:scaleX(0)}14%,44%{transform:scaleX(var(--v,1))}}
@media (prefers-reduced-motion:reduce){
  .ag .bar{animation:none;transform:scaleX(var(--v,1))}
}
/* --------------------------------------------------------------------- */
small{display:block;margin-top:14px;color:var(--muted);text-align:center}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="const d=document.documentElement,e=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=e==='dark'?'light':'dark'">light / dark</button>
<div>
<svg class="ag" viewBox="0 0 112 112" aria-hidden="true">
  <line class="rail" x1="28" y1="40" x2="86" y2="40"/>
  <line class="rail" x1="28" y1="56" x2="86" y2="56"/>
  <line class="rail" x1="28" y1="72" x2="86" y2="72"/>
  <rect class="bar" x="27" y="37" width="58" height="6" rx="3" style="--o:0;--v:1"/>
  <rect class="bar" x="27" y="53" width="58" height="6" rx="3" style="--o:1;--v:.8"/>
  <rect class="bar" x="27" y="69" width="58" height="6" rx="3" style="--o:2;--v:.55"/>
</svg>
<small>bars grow from the left edge, staggered — 6 s loop</small>
</div>
<script>addEventListener('message',e=>{if(e.data&&e.data.motionTheme)document.documentElement.dataset.theme=e.data.motionTheme})</script>
</body>
</html>
