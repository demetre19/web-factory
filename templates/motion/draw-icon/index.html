<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: draw-icon — line-drawn SVG on in-view</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--card:#fff;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--card:#1c1c19;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--card:#1c1c19;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.demo{text-align:center}
svg{width:140px;height:140px}
/* --- recipe ---------------------------------------------------------- */
/* Every drawable path gets pathLength="1" so dasharray can be unitless.
   .in (added by IO / replay) runs a dashoffset TRANSITION — not a loop. */
.di path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.di .draw{stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-dashoffset .8s var(--ease-out);
  transition-delay:calc(var(--o,0)*.15s)}
.di .fill{fill:var(--accent);stroke:none;opacity:0;transition:opacity .3s ease 1.1s}
.di.in .draw{stroke-dashoffset:0}
.di.in .fill{opacity:1}
@media (prefers-reduced-motion:reduce){
  .di .draw,.di .fill{transition:none}
  .di .draw{stroke-dashoffset:0}
  .di .fill{opacity:1}
}
/* --------------------------------------------------------------------- */
button{margin-top:18px;padding:.5em 1.2em;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
small{display:block;margin-top:10px;color:var(--muted)}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div class="demo">
<svg class="di" id="icon" viewBox="0 0 64 64" aria-hidden="true">
  <circle class="draw" pathLength="1" cx="32" cy="32" r="26" style="--o:0"/>
  <path class="draw" pathLength="1" d="M22 34h20" style="--o:1"/>
  <path class="draw" pathLength="1" d="M22 40h14" style="--o:2"/>
  <path class="draw" pathLength="1" d="M24 26l6 6 12-13" style="--o:3"/>
  <circle class="fill" cx="50" cy="16" r="4"/>
</svg>
<div><button id="replay">replay</button>
<small>in-view trigger via IntersectionObserver; draw once, stay drawn</small></div>
</div>
<script>
// recipe JS — ~10 lines. IO adds .in once, unobserve; replay resets.
const el = document.getElementById('icon');
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}, { threshold: .15 });
io.observe(el);
document.getElementById('replay').onclick = () => {
  el.classList.remove('in'); void el.getBoundingClientRect(); el.classList.add('in');
};
if (matchMedia('(prefers-reduced-motion: reduce)').matches) el.classList.add('in');
</script>
</body>
</html>
