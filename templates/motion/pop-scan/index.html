<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: pop-scan — scale-pop + gliding lens loop</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);--pass:6s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
svg{width:140px;height:140px}
/* --- recipe ----------------------------------------------------------
   transform-box:fill-box makes transform-origin resolve to the SVG
   element's own box — required for scale on bare <circle>/<rect>. */
.ps *{animation-duration:var(--pass);animation-iteration-count:infinite;
  animation-timing-function:var(--ease-out);animation-fill-mode:both}
.ps .dot{fill:var(--ink);opacity:.25}
.ps .pop{fill:var(--accent);transform-box:fill-box;transform-origin:50% 50%;
  animation-name:ps-pop}
.ps .lens{animation-name:ps-lens}
.ps .lens circle{fill:none;stroke:var(--accent);stroke-width:3}
.ps .lens path{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
@keyframes ps-pop{0%,8%,56%,100%{transform:scale(0)}14%,44%{transform:scale(1)}}
@keyframes ps-lens{0%,56%,100%{transform:translate(-18px,-14px)}12%,44%{transform:none}}
@media (prefers-reduced-motion:reduce){.ps *{animation:none!important}}
/* --------------------------------------------------------------------- */
small{display:block;margin-top:14px;color:var(--muted);text-align:center}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div>
<svg class="ps" viewBox="0 0 112 112" aria-hidden="true">
  <circle class="dot" cx="36" cy="42" r="3"/><circle class="dot" cx="52" cy="32" r="3"/>
  <circle class="dot" cx="80" cy="40" r="3"/><circle class="dot" cx="34" cy="64" r="3"/>
  <circle class="dot" cx="46" cy="80" r="3"/><circle class="dot" cx="84" cy="66" r="3"/>
  <circle class="dot" cx="62" cy="84" r="3"/>
  <circle class="pop" cx="60" cy="56" r="6"/>
  <g class="lens"><circle cx="60" cy="56" r="15"/><path d="M71 67l11 11"/></g>
</svg>
<small>a found dot pops while a lens glides over it — 6 s loop</small>
</div>
</body>
</html>
