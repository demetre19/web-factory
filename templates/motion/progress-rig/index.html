<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: progress-rig — @property-driven track fill</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-soft:cubic-bezier(.33,1,.68,1);--pass:6s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.demo{width:min(320px,80vw)}
/* --- recipe ----------------------------------------------------------
   @property registers --p as a <number> so it interpolates. The rig
   animates --p 0→1; children read it via scaleX() / calc() — one
   animation drives the whole assembly. Fallback: transform keyframes. */
@property --p{syntax:"<number>";inherits:true;initial-value:0}
.rig{position:relative;height:6px;margin-top:40px;
  animation:rig-p var(--pass) linear infinite}
@keyframes rig-p{0%{--p:0}60%,100%{--p:1}}
.track{position:absolute;inset:0;background:var(--line);border-radius:3px}
.fill{position:absolute;inset:0;background:var(--accent);border-radius:3px;
  transform-origin:0 50%;transform:scaleX(var(--p));
  animation:rig-fillfade var(--pass) linear infinite}
.token{position:absolute;top:50%;left:calc(var(--p)*100%);width:12px;height:12px;
  margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg);
  border:2px solid var(--accent);
  animation:rig-token var(--pass) linear infinite}
@keyframes rig-fillfade{0%,90%{opacity:1}100%{opacity:0}}
@keyframes rig-token{0%{opacity:0}3%,57%{opacity:1}62%,100%{opacity:0}}
/* fallback when @property unsupported: JS adds .no-prop, transform keyframes take over */
.no-prop .rig{animation:none}
.no-prop .fill{transform:none;animation:rig-fb var(--pass) linear infinite}
.no-prop .token{left:auto;animation:rig-tokfb var(--pass) linear infinite}
@keyframes rig-fb{0%{transform:scaleX(0)}60%,90%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes rig-tokfb{0%{left:0;opacity:0}3%,57%{opacity:1}62%,100%{left:100%;opacity:0}}
@media (prefers-reduced-motion:reduce){
  .rig,.fill,.token{animation:none!important}
  .fill{transform:scaleX(1)}
}
/* --------------------------------------------------------------------- */
small{display:block;margin-top:16px;color:var(--muted)}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div class="demo">
  <p style="font:600 1.1rem/1.3 system-ui;margin:0">input <b style="color:var(--accent)">→</b> output</p>
  <div class="rig"><span class="track"></span><span class="fill"></span><span class="token"></span></div>
  <small>one animated --p variable drives bar + token — 6 s loop</small>
</div>
<script>
// @property detect — @supports cannot test at-rules; CSS.registerProperty
// exists exactly when @property does. 1 line, js_dependency:light.
if (!CSS.registerProperty) document.documentElement.classList.add('no-prop');
</script>
</body>
</html>
