<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe: reveal-fade — in-view fade + rise (IO, one-shot)</title>
<style>
:root{
  --bg:#f4f1e6;--ink:#141412;--muted:#6e6a5c;--line:#e0dccf;--accent:#5e7355;
  --ease-out:cubic-bezier(.19,1,.22,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}}
[data-theme=dark]{--bg:#141412;--ink:#f0efe9;--muted:#a09c8f;--line:#2a2a26;--accent:#90a985}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 24px}
.spacer{min-height:80vh;display:grid;place-items:center;color:var(--muted)}
/* --- recipe ----------------------------------------------------------
   The canonical entrance: opacity + translateY(28px) → rest, once, on
   in-view. --d staggers siblings. One transition, transform+opacity only. */
.rv{opacity:0;transform:translateY(28px);
  transition:opacity 1s var(--ease-out),transform 1s var(--ease-out);
  transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;transition:opacity .15s ease}}
/* --------------------------------------------------------------------- */
.card{border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
.card b{color:var(--accent)}
.theme{position:fixed;top:12px;right:12px;font:12px system-ui;padding:.4em .8em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<button class="theme" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">light / dark</button>
<div class="wrap">
  <div class="spacer"><p>scroll ↓</p></div>
  <div class="card rv" style="--d:0ms"><b>Card one</b><p>Enters on its own — opacity + 28px rise, 1s ease-out.</p></div>
  <div class="card rv" style="--d:80ms"><b>Card two</b><p>--d:80ms staggers it behind the first.</p></div>
  <div class="card rv" style="--d:160ms"><b>Card three</b><p>--d:160ms — the sequence reads as one coordinated move (M.4).</p></div>
  <div class="spacer"></div>
</div>
<script>
// recipe JS — IO one-shot reveal; reduced-motion reveals immediately
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}, { threshold: .08, rootMargin: '0px 0px -10% 0px' });
document.querySelectorAll('.rv').forEach(el => io.observe(el));
if (matchMedia('(prefers-reduced-motion: reduce)').matches)
  document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
</script>
</body>
</html>
