<div class="border-b-2 border-black px-2">
  <div role="tablist" class="-mb-0.5 flex">
    <button
      role="tab"
      aria-selected="true"
      class="border-2 border-black bg-yellow-200 px-6 py-2 font-semibold text-black focus:ring-2 focus:ring-yellow-300 focus:outline-hidden"
    >
      Profile
    </button>

    <button
      role="tab"
      aria-selected="false"
      class="border-2 border-transparent px-6 py-2 font-semibold text-black hover:bg-black hover:text-white focus:ring-2 focus:ring-yellow-300 focus:outline-hidden"
    >
      Account
    </button>

    <button
      role="tab"
      aria-selected="false"
      class="border-2 border-transparent px-6 py-2 font-semibold text-black hover:bg-black hover:text-white focus:ring-2 focus:ring-yellow-300 focus:outline-hidden"
    >
      Notifications
    </button>
  </div>
</div>
