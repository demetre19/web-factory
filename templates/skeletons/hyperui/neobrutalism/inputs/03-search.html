<label for="Search">
  <span class="sr-only"> Search </span>

  <div
    class="flex border-2 border-black shadow-[4px_4px_0_0] shadow-black focus-within:ring-2 focus-within:ring-yellow-300"
  >
    <input
      type="search"
      id="Search"
      class="w-full border-none bg-white text-black focus:ring-0 sm:text-sm"
    />

    <button
      type="submit"
      class="bg-yellow-300 px-4 py-2 text-xs/none font-bold tracking-wide uppercase hover:bg-yellow-400 focus:bg-yellow-400 focus:outline-hidden"
    >
      Search
    </button>
  </div>
