<form
  action="#"
  class="mx-auto grid max-w-lg grid-cols-1 gap-4 rounded-lg border border-gray-300 bg-gray-100 p-6 sm:grid-cols-2"
>
  <div class="md:col-span-2">
    <label class="block text-sm font-medium text-gray-900" for="name">Name</label>

    <input
      class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-hidden"
      id="name"
      type="text"
      autocomplete="name"
      placeholder="Your name"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-900" for="email">Email</label>

    <input
      class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-hidden"
      id="email"
      type="email"
      autocomplete="email"
      placeholder="Your email"
    />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-900" for="phone">Phone</label>

    <input
      class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-hidden"
      id="phone"
      type="tel"
      autocomplete="tel"
      placeholder="Your phone"
    />
  </div>

  <div class="md:col-span-2">
    <label class="block text-sm font-medium text-gray-900" for="message">Message</label>

    <textarea
      class="mt-1 w-full resize-none rounded-lg border-gray-300 focus:border-indigo-500 focus:outline-hidden"
      id="message"
      rows="4"
      placeholder="Your message"
    ></textarea>
  </div>

  <div class="md:col-span-2">
    <button
      class="block w-full rounded-lg border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white transition-colors hover:bg-transparent hover:text-indigo-600"
      type="submit"
    >
      Send Message
    </button>
  </div>
</form>
