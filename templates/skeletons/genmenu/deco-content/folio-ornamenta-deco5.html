<div class="space-y-3 text-[15px] leading-relaxed text-[#292524]"><p>Editorial emphasis works best when calibrated to the reading rhythm. A <mark class="bg-[#FEF3C7] text-[#181715] px-1.5 py-0.5 rounded-sm font-medium">warm parchment highlighter wash</mark> draws immediate focus without harsh neon glare.</p><p>For scholarly cross-references, prefer a <mark class="bg-transparent text-[#181715] font-medium border-b-2 border-[#1E3A8A]/70 pb-0.5">crisp lapis baseline stroke</mark> or subtle <mark class="bg-[#EBE6DF] text-[#181715] px-1.5 py-0.5 rounded border border-[#D6CEBE]">archival ink tint</mark> that preserves line height.</p></div>
