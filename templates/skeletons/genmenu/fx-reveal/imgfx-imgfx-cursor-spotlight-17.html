<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>17 · Darkroom Aperture Spotlight — Atelier Reveal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .photo-color {
      background:
        radial-gradient(90% 70% at 62% 28%, rgba(250, 198, 138, 0.85) 0%, rgba(214, 128, 72, 0.45) 42%, transparent 68%),
        radial-gradient(65% 60% at 24% 68%, rgba(92, 134, 166, 0.55) 0%, transparent 65%),
        linear-gradient(148deg, #1d222b 0%, #5c4b3f 44%, #c4875e 74%, #f2cfa6 100%);
    }
    .film-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.52'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
<script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
<body class="min-h-screen bg-[#F5F4EF] text-[#151412] dark:bg-[#0D0E10] dark:text-[#F2EFEA] font-sans antialiased transition-colors duration-300">
  <header class="max-w-5xl mx-auto px-6 py-6 flex items-center justify-between border-b border-black/10 dark:border-white/10">
    <div class="flex items-baseline gap-4">
      <span class="font-mono text-xs tracking-wider text-neutral-500 dark:text-neutral-400">17 / 24</span>
      <h1 class="font-serif text-2xl sm:text-3xl tracking-tight font-medium">Darkroom Aperture Spotlight</h1>
    </div>
    <button id="themeToggle" type="button" aria-label="Toggle light or dark theme" class="px-3.5 py-1.5 text-xs font-medium border border-black/15 dark:border-white/15 rounded-md hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B] transition-colors">
      <span id="themeLabel">Light Mode</span>
    </button>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12">
    <p class="max-w-2xl text-sm text-neutral-600 dark:text-neutral-400 mb-8 leading-relaxed">
      Sweep your cursor—or focus the stage and press arrow keys—to guide a warm color loupe across the darkened nocturnal gallery plate.
    </p>

    <div id="spotlightStage" tabindex="0" role="region" aria-label="Nocturne Gallery Inspection Stage" aria-describedby="spot-caption" class="relative h-[470px] rounded-2xl overflow-hidden border border-black/10 dark:border-white/10 cursor-crosshair focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B]">
      <!-- Masked Monochrome Base -->
      <div class="absolute inset-0 photo-color filter grayscale brightness-[0.26] contrast-125">
        <svg viewBox="0 0 900 470" preserveAspectRatio="xMidYMid slice" aria-hidden="true" class="w-full h-full">
          <rect x="0" y="330" width="900" height="140" fill="#0d0d0c" fill-opacity="0.72" />
          <rect x="190" y="100" width="145" height="230" fill="#ffffff" fill-opacity="0.16" />
          <rect x="380" y="75" width="165" height="255" fill="#ffffff" fill-opacity="0.2" />
          <rect x="590" y="110" width="130" height="220" fill="#ffffff" fill-opacity="0.14" />
        </svg>
      </div>

      <!-- Full-Color Spotlight Layer -->
      <div id="colorReveal" class="absolute inset-0 photo-color pointer-events-none" style="clip-path: circle(135px at 50% 48%);">
        <svg viewBox="0 0 900 470" preserveAspectRatio="xMidYMid slice" aria-hidden="true" class="w-full h-full">
          <rect x="0" y="330" width="900" height="140" fill="#171310" fill-opacity="0.72" />
          <rect x="190" y="100" width="145" height="230" fill="#fae1c0" fill-opacity="0.28" />
          <rect x="380" y="75" width="165" height="255" fill="#f7c894" fill-opacity="0.34" />
          <rect x="590" y="110" width="130" height="220" fill="#cbe0f0" fill-opacity="0.25" />
          <circle cx="462" cy="185" r="42" fill="#fff0d8" fill-opacity="0.32" />
        </svg>
        <div aria-hidden="true" class="film-grain absolute inset-0 opacity-40"></div>
      </div>

      <div id="spot-caption" class="absolute bottom-6 left-6 right-6 flex items-center justify-between text-xs font-mono text-white/85 pointer-events-none">
        <span>BERLIN · NOCTURNE ARCHIVE PLATE 17</span>
        <span id="spotCoords">LOUPE 50% · 48%</span>
      </div>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const stage = document.getElementById('spotlightStage');
    const colorReveal = document.getElementById('colorReveal');
    const spotCoords = document.getElementById('spotCoords');

    let px = 50, py = 48;

    function updateSpot(xPct, yPct) {
      px = Math.max(5, Math.min(95, xPct));
      py = Math.max(5, Math.min(95, yPct));
      colorReveal.style.clipPath = `circle(145px at ${px.toFixed(1)}% ${py.toFixed(1)}%)`;
      spotCoords.textContent = `LOUPE ${Math.round(px)}% · ${Math.round(py)}%`;
    }

    stage.addEventListener('pointermove', (e) => {
      const r = stage.getBoundingClientRect();
      updateSpot(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
    });

    stage.addEventListener('keydown', (e) => {
      const step = 6;
      if (e.key === 'ArrowRight') { e.preventDefault(); updateSpot(px + step, py); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); updateSpot(px - step, py); }
      if (e.key === 'ArrowUp') { e.preventDefault(); updateSpot(px, py - step); }
      if (e.key === 'ArrowDown') { e.preventDefault(); updateSpot(px, py + step); }
    });
  </script>
</body>
</html>
