<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 · Solar Hour Sequence Scrub — Atelier Reveal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    .film-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.52'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
<script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
<body class="bg-[#F6F4EF] text-[#151412] dark:bg-[#0D0E11] dark:text-[#F2EFEA] font-sans antialiased transition-colors duration-300">
  <header class="sticky top-0 z-40 bg-[#F6F4EF]/90 dark:bg-[#0D0E11]/90 backdrop-blur-md border-b border-black/10 dark:border-white/10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-baseline gap-4">
        <span class="font-mono text-xs tracking-wider text-neutral-500 dark:text-neutral-400">12 / 24</span>
        <h1 class="font-serif text-2xl sm:text-3xl tracking-tight font-medium">Solar Hour Sequence Scrub</h1>
      </div>
      <button id="themeToggle" type="button" aria-label="Toggle light or dark theme" class="px-3.5 py-1.5 text-xs font-medium border border-black/15 dark:border-white/15 rounded-md hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B] transition-colors">
        <span id="themeLabel">Light Mode</span>
      </button>
    </div>
  </header>

  <main>
    <section id="scrubTrack" class="relative h-[280vh]">
      <div class="sticky top-16 h-[calc(100vh-4rem)] max-w-6xl mx-auto px-6 py-8 flex flex-col justify-between">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <p class="text-sm text-neutral-600 dark:text-neutral-400 max-w-xl">
            Scroll vertically to scrub through 8 continuous exposure frames—or step through frames with the reel controls below.
          </p>
          <div class="flex items-center gap-2" role="group" aria-label="Frame selector">
            <button type="button" id="prevFrame" class="px-3 py-1.5 text-xs font-mono border border-black/15 dark:border-white/15 rounded-md hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B]">Prev</button>
            <span id="frameBadge" class="font-mono text-xs px-2">FRAME 01 / 08</span>
            <button type="button" id="nextFrame" class="px-3 py-1.5 text-xs font-mono border border-black/15 dark:border-white/15 rounded-md hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B]">Next</button>
          </div>
        </div>

        <!-- Scrubbed Photographic Stage -->
        <div id="reelViewport" class="relative flex-1 my-5 rounded-2xl overflow-hidden border border-black/10 dark:border-white/10 transition-[background] duration-150">
          <svg viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid slice" aria-hidden="true" class="absolute inset-0 w-full h-full">
            <circle id="sunDisc" cx="220" cy="220" r="64" fill="#fff2dc" fill-opacity="0.65" />
            <polygon points="0,430 1200,380 1200,620 0,620" fill="#121417" fill-opacity="0.72" />
            <rect x="340" y="210" width="520" height="220" fill="#181a1f" fill-opacity="0.75" />
            <rect x="420" y="240" width="140" height="140" fill="#f2dec4" fill-opacity="0.22" />
            <rect x="640" y="240" width="140" height="140" fill="#f2dec4" fill-opacity="0.16" />
          </svg>
          <div aria-hidden="true" class="film-grain absolute inset-0 opacity-40 pointer-events-none"></div>
          <div aria-hidden="true" class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>

          <div class="absolute bottom-7 left-7 right-7 flex flex-col sm:flex-row sm:items-end justify-between gap-4 text-white">
            <div>
              <span id="timeStamp" class="font-mono text-xs text-[#F1A374]">06:15 · FIRST BLUE HOUR</span>
              <h2 id="frameTitle" class="font-serif text-3xl sm:text-4xl font-medium mt-1">Helios Gallery — Athens</h2>
            </div>
            <div class="w-full sm:w-56">
              <div class="flex justify-between font-mono text-[11px] text-white/75 mb-1.5">
                <span>REEL SCRUB</span>
                <span id="scrubPct">0%</span>
              </div>
              <div class="h-1 w-full bg-white/20 rounded-full overflow-hidden">
                <div id="scrubBar" class="h-full bg-[#E07F4B] w-0"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const frames = [
      { time: '06:15 · FIRST BLUE HOUR', bg: 'radial-gradient(90% 70% at 20% 60%, rgba(126,158,196,0.5) 0%, transparent 60%), linear-gradient(170deg, #101624 0%, #2b3c54 60%, #63748c 100%)', sunX: 190, sunY: 360, sunOp: 0.35 },
      { time: '07:40 · ROSE DAWN', bg: 'radial-gradient(90% 70% at 28% 48%, rgba(235,172,140,0.6) 0%, transparent 58%), linear-gradient(168deg, #211d2b 0%, #6b4e5a 55%, #bf8976 100%)', sunX: 290, sunY: 280, sunOp: 0.55 },
      { time: '09:30 · MORNING GOLD', bg: 'radial-gradient(90% 70% at 38% 34%, rgba(250,224,175,0.72) 0%, transparent 58%), linear-gradient(166deg, #2a2623 0%, #867157 52%, #dfc6a3 100%)', sunX: 430, sunY: 205, sunOp: 0.72 },
      { time: '12:15 · HIGH ZENITH', bg: 'radial-gradient(90% 70% at 50% 20%, rgba(242,246,250,0.75) 0%, transparent 58%), linear-gradient(175deg, #232c36 0%, #65798b 50%, #cdd8e0 100%)', sunX: 600, sunY: 135, sunOp: 0.85 },
      { time: '15:20 · WARM LIMESTONE', bg: 'radial-gradient(90% 70% at 64% 28%, rgba(250,219,178,0.7) 0%, transparent 58%), linear-gradient(168deg, #28221e 0%, #856850 52%, #dfc09d 100%)', sunX: 760, sunY: 185, sunOp: 0.75 },
      { time: '17:55 · AMBER GLAZE', bg: 'radial-gradient(90% 70% at 76% 42%, rgba(242,168,116,0.68) 0%, transparent 58%), linear-gradient(166deg, #241714 0%, #7c4734 54%, #d38d65 100%)', sunX: 900, sunY: 255, sunOp: 0.68 },
      { time: '19:30 · VIOLET DUSK', bg: 'radial-gradient(90% 70% at 84% 56%, rgba(196,134,126,0.5) 0%, transparent 58%), linear-gradient(170deg, #171622 0%, #43374b 56%, #886974 100%)', sunX: 1010, sunY: 335, sunOp: 0.42 },
      { time: '21:10 · NOCTURNE TUNGSTEN', bg: 'radial-gradient(90% 70% at 50% 65%, rgba(212,165,112,0.34) 0%, transparent 58%), linear-gradient(175deg, #0b0d12 0%, #19202b 58%, #343d4b 100%)', sunX: 1080, sunY: 420, sunOp: 0.14 }
    ];

    const track = document.getElementById('scrubTrack');
    const viewport = document.getElementById('reelViewport');
    const sunDisc = document.getElementById('sunDisc');
    const timeStamp = document.getElementById('timeStamp');
    const frameBadge = document.getElementById('frameBadge');
    const scrubPct = document.getElementById('scrubPct');
    const scrubBar = document.getElementById('scrubBar');

    let activeFrame = 0;

    function renderFrame(index, progressOverride) {
      const i = Math.max(0, Math.min(frames.length - 1, index));
      activeFrame = i;
      const f = frames[i];
      viewport.style.background = f.bg;
      sunDisc.setAttribute('cx', String(f.sunX));
      sunDisc.setAttribute('cy', String(f.sunY));
      sunDisc.setAttribute('fill-opacity', String(f.sunOp));
      timeStamp.textContent = f.time;
      frameBadge.textContent = `FRAME ${String(i + 1).padStart(2, '0')} / 08`;
      const pct = progressOverride !== undefined ? Math.round(progressOverride * 100) : Math.round((i / (frames.length - 1)) * 100);
      scrubPct.textContent = `${pct}%`;
      scrubBar.style.width = `${pct}%`;
    }

    function onScroll() {
      const rect = track.getBoundingClientRect();
      const total = Math.max(1, track.offsetHeight - window.innerHeight);
      const p = Math.min(1, Math.max(0, -rect.top / total));
      const idx = Math.min(frames.length - 1, Math.floor(p * frames.length));
      renderFrame(idx, p);
    }

    window.addEventListener('scroll', () => requestAnimationFrame(onScroll), { passive: true });
    document.getElementById('prevFrame').addEventListener('click', () => renderFrame(activeFrame - 1));
    document.getElementById('nextFrame').addEventListener('click', () => renderFrame(activeFrame + 1));

    renderFrame(0, 0);
  </script>
</body>
</html>
