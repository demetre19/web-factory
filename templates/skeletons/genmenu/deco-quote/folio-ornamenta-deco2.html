<figure class="grid grid-cols-1 sm:grid-cols-[120px_1fr] gap-3 sm:gap-5 items-start"><div class="pt-1 text-xs font-medium text-[#78716C] sm:text-right leading-snug"><span>Marginalia · Sec. II</span></div><div class="border-l-4 border-[#1E3A8A] pl-4 sm:pl-5 py-1 bg-[#FAF8F4]/70"><blockquote><p class="font-serif text-base sm:text-lg leading-relaxed text-[#181715]">Margins are not wasted space; they are the breathing room that frames the reader’s attention and gives cadence to the page.</p></blockquote><figcaption class="mt-3 flex flex-wrap items-center gap-2 text-xs text-[#57534E]"><cite class="not-italic font-semibold text-[#181715]">Robert Bringhurst</cite><span aria-hidden="true">·</span><span>The Elements of Typographic Style</span></figcaption></div></figure>
