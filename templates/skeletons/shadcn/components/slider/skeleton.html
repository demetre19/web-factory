<!-- ── Slider ── -->
<span data-orientation="horizontal" data-slot="slider" defaultValue="{defaultValue}" value="{value}" min="{min}" max="{max}" class="relative flex w-full touch-none items-center select-none data-[disabled]:opacity-50 data-[orientation=vertical]:h-full data-[orientation=vertical]:min-h-44 data-[orientation=vertical]:w-auto data-[orientation=vertical]:flex-col {class}">
      <span data-orientation="horizontal" data-slot="slider-track" class="relative grow overflow-hidden rounded-full bg-muted data-[orientation=horizontal]:h-1.5 data-[orientation=horizontal]:w-full data-[orientation=vertical]:h-full data-[orientation=vertical]:w-1.5">
        <span data-orientation="horizontal" data-slot="slider-range" class="absolute bg-primary data-[orientation=horizontal]:h-full data-[orientation=vertical]:w-full"></span>
      </span>
      Array.from({length: _values.length}, (_, index) => (
        <span role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{value}" aria-orientation="horizontal" tabindex="0" data-slot="slider-thumb" key="{index}" class="block size-4 shrink-0 rounded-full border border-primary bg-white shadow-sm ring-ring/50 transition-[color,box-shadow] hover:ring-4 focus-visible:ring-4 focus-visible:outline-hidden disabled:pointer-events-none disabled:opacity-50"></span>
      ))
    </span>
