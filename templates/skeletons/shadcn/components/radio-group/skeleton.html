<!-- ── RadioGroup ── -->
<div role="radiogroup" data-slot="radio-group" class="grid gap-3 {class}"></div>

<!-- ── RadioGroupItem ── -->
<button type="button" role="radio" aria-checked="false" data-state="unchecked" tabindex="-1" data-slot="radio-group-item" class="aspect-square size-4 shrink-0 rounded-full border border-input text-primary shadow-xs transition-[color,box-shadow] outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:bg-input/30 dark:aria-invalid:ring-destructive/40 {class}">
      <span data-state="unchecked" data-slot="radio-group-indicator" class="relative flex items-center justify-center">
        <svg aria-hidden="true" data-icon="CircleIcon" class="absolute top-1/2 left-1/2 size-2 -translate-x-1/2 -translate-y-1/2 fill-primary"></svg>
      </span>
    </button>
