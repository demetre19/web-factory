<!-- ── Card ── -->
<div data-slot="card" class="flex flex-col gap-6 rounded-xl border bg-card py-6 text-card-foreground shadow-sm {class}"></div>

<!-- ── CardHeader ── -->
<div data-slot="card-header" class="@container/card-header grid auto-rows-min grid-rows-[auto_auto] items-start gap-2 px-6 has-data-[slot=card-action]:grid-cols-[1fr_auto] [.border-b]:pb-6 {class}"></div>

<!-- ── CardTitle ── -->
<div data-slot="card-title" class="leading-none font-semibold {class}"></div>

<!-- ── CardDescription ── -->
<div data-slot="card-description" class="text-sm text-muted-foreground {class}"></div>

<!-- ── CardAction ── -->
<div data-slot="card-action" class="col-start-2 row-span-2 row-start-1 self-start justify-self-end {class}"></div>

<!-- ── CardContent ── -->
<div data-slot="card-content" class="px-6 {class}"></div>

<!-- ── CardFooter ── -->
<div data-slot="card-footer" class="flex items-center px-6 [.border-t]:pt-6 {class}"></div>
