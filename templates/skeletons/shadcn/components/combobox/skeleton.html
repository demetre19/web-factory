<!-- ── ComboboxValue ── -->
<span data-slot="combobox-value"></span>

<!-- ── ComboboxTrigger ── -->
<button type="button" aria-haspopup="listbox" data-slot="combobox-trigger" class="[&_svg:not([class*='size-'])]:size-4 {class}">
      {children}
      <svg aria-hidden="true" data-icon="ChevronDownIcon" class="pointer-events-none size-4 text-muted-foreground"></svg>
    </button>

<!-- ── ComboboxInput ── -->
<div data-slot="input-group" role="group" class="w-auto {class} group/input-group relative flex w-full items-center rounded-md border border-input shadow-xs transition-[color,box-shadow] outline-none dark:bg-input/30 h-9 min-w-0 has-[>textarea]:h-auto has-[>[data-align=inline-start]]:[&>input]:pl-2 has-[>[data-align=inline-end]]:[&>input]:pr-2 has-[>[data-align=block-start]]:h-auto has-[>[data-align=block-start]]:flex-col has-[>[data-align=block-start]]:[&>input]:pb-3 has-[>[data-align=block-end]]:h-auto has-[>[data-align=block-end]]:flex-col has-[>[data-align=block-end]]:[&>input]:pt-3 has-[[data-slot=input-group-control]:focus-visible]:border-ring has-[[data-slot=input-group-control]:focus-visible]:ring-[3px] has-[[data-slot=input-group-control]:focus-visible]:ring-ring/50 has-[[data-slot][aria-invalid=true]]:border-destructive has-[[data-slot][aria-invalid=true]]:ring-destructive/20 dark:has-[[data-slot][aria-invalid=true]]:ring-destructive/40 {class}"></div>
<!-- call-site children -->
      <input role="combobox" aria-expanded="false" aria-controls="{listbox-id}" type="text" autocomplete="off" data-render="{component}">
      <div role="group" data-slot="input-group-addon" data-align="{align}" class="flex h-auto cursor-text items-center justify-center gap-2 py-1.5 text-sm font-medium text-muted-foreground select-none group-data-[disabled=true]/input-group:opacity-50 [&>kbd]:rounded-[calc(var(--radius)-5px)] [&>svg:not([class*='size-'])]:size-4 order-first pl-3 has-[>button]:ml-[-0.45rem] has-[>kbd]:ml-[-0.35rem] {class}"></div>
<!-- call-site children -->
        <!-- when showTrigger --><button data-slot="button" data-variant="{variant}" data-size="{size}" class="group-has-data-[slot=combobox-clear]/input-group:hidden data-pressed:bg-transparent flex items-center gap-2 text-sm shadow-none h-6 gap-1 rounded-[calc(var(--radius)-5px)] px-2 has-[>svg]:px-2 [&>svg:not([class*='size-'])]:size-3.5 {class} inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3"></button>
<!-- call-site children -->
            <button type="button" aria-haspopup="listbox" data-slot="combobox-trigger" class="[&_svg:not([class*='size-'])]:size-4 {class}">
      {children}
      <svg aria-hidden="true" data-icon="ChevronDownIcon" class="pointer-events-none size-4 text-muted-foreground"></svg>
    </button><!-- /when -->
        <!-- when showClear --><button type="button" data-slot="combobox-clear" data-render="{component}" class="{class}">
      <svg aria-hidden="true" data-icon="XIcon" class="pointer-events-none"></svg>
    </button><!-- /when -->
      
      {children}

<!-- ── ComboboxContent ── -->
<div side="{side}" sideOffset="{sideOffset}" align="{align}" alignOffset="{alignOffset}" anchor="{anchor}" class="isolate z-50">
        <div data-state="open" data-slot="combobox-content" data-chips="{!!anchor}" class="group/combobox-content relative max-h-96 w-(--anchor-width) max-w-(--available-width) min-w-[calc(var(--anchor-width)+--spacing(7))] origin-(--transform-origin) overflow-hidden rounded-md bg-popover text-popover-foreground shadow-md ring-1 ring-foreground/10 duration-100 data-[chips=true]:min-w-(--anchor-width) data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 *:data-[slot=input-group]:m-1 *:data-[slot=input-group]:mb-0 *:data-[slot=input-group]:h-8 *:data-[slot=input-group]:border-input/30 *:data-[slot=input-group]:bg-input/30 *:data-[slot=input-group]:shadow-none data-open:animate-in data-open:fade-in-0 data-open:zoom-in-95 data-closed:animate-out data-closed:fade-out-0 data-closed:zoom-out-95 {class}"></div>
      </div>

<!-- ── ComboboxList ── -->
<div role="listbox" data-state="open" data-slot="combobox-list" class="max-h-[min(calc(--spacing(96)---spacing(9)),calc(var(--available-height)---spacing(9)))] scroll-py-1 overflow-y-auto p-1 data-empty:p-0 {class}"></div>

<!-- ── ComboboxItem ── -->
<div role="option" aria-selected="false" tabindex="-1" data-slot="combobox-item" class="relative flex w-full cursor-default items-center gap-2 rounded-sm py-1.5 pr-8 pl-2 text-sm outline-hidden select-none data-highlighted:bg-accent data-highlighted:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 {class}">
      {children}
      <span data-slot="combobox-item-indicator" data-render="{component}">
        <svg aria-hidden="true" data-icon="CheckIcon" class="pointer-events-none size-4 pointer-coarse:size-5"></svg>
      </span>
    </div>

<!-- ── ComboboxGroup ── -->
<div role="group" data-slot="combobox-group" class="{class}"></div>

<!-- ── ComboboxLabel ── -->
<div data-slot="combobox-label" class="px-2 py-1.5 text-xs text-muted-foreground pointer-coarse:px-3 pointer-coarse:py-2 pointer-coarse:text-sm {class}"></div>

<!-- ── ComboboxEmpty ── -->
<div role="presentation" data-slot="combobox-empty" class="hidden w-full justify-center py-2 text-center text-sm text-muted-foreground group-data-empty/combobox-content:flex {class}"></div>

<!-- ── ComboboxSeparator ── -->
<div role="separator" data-slot="combobox-separator" class="-mx-1 my-1 h-px bg-border {class}"></div>

<!-- ── ComboboxChips ── -->
<div data-slot="combobox-chips" class="flex min-h-9 flex-wrap items-center gap-1.5 rounded-md border border-input bg-transparent bg-clip-padding px-2.5 py-1.5 text-sm shadow-xs transition-[color,box-shadow] focus-within:border-ring focus-within:ring-[3px] focus-within:ring-ring/50 has-aria-invalid:border-destructive has-aria-invalid:ring-[3px] has-aria-invalid:ring-destructive/20 has-data-[slot=combobox-chip]:px-1.5 dark:bg-input/30 dark:has-aria-invalid:border-destructive/50 dark:has-aria-invalid:ring-destructive/40 {class}"></div>

<!-- ── ComboboxChip ── -->
<span data-slot="combobox-chip" class="flex h-[calc(--spacing(5.5))] w-fit items-center justify-center gap-1 rounded-sm bg-muted px-1.5 text-xs font-medium whitespace-nowrap text-foreground has-disabled:pointer-events-none has-disabled:cursor-not-allowed has-disabled:opacity-50 has-data-[slot=combobox-chip-remove]:pr-0 {class}">
      {children}
      <!-- when showRemove --><button type="button" data-render="{component}" data-slot="combobox-chip-remove" class="-ml-1 opacity-50 hover:opacity-100">
          <svg aria-hidden="true" data-icon="XIcon" class="pointer-events-none"></svg>
        </button><!-- /when -->
    </span>

<!-- ── ComboboxChipsInput ── -->
<input role="combobox" aria-expanded="false" aria-controls="{listbox-id}" type="text" autocomplete="off" data-slot="combobox-chip-input" class="min-w-16 flex-1 outline-none {class}">
