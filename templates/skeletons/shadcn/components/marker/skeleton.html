<!-- ── Marker ── -->
<div data-slot="marker" data-variant="{variant}" class="group/marker relative flex min-h-4 w-full items-center gap-2 text-left text-sm text-muted-foreground [&_svg:not([class*='size-'])]:size-4 [a]:underline [a]:underline-offset-3 [a]:hover:text-foreground"></div>

<!-- ── MarkerIcon ── -->
<span data-slot="marker-icon" aria-hidden="true" class="size-4 shrink-0 [&_svg:not([class*='size-'])]:size-4 {class}"></span>

<!-- ── MarkerContent ── -->
<span data-slot="marker-content" class="min-w-0 wrap-break-word group-data-[variant=separator]/marker:flex-none group-data-[variant=separator]/marker:text-center *:[a]:underline *:[a]:underline-offset-3 *:[a]:hover:text-foreground {class}"></span>
