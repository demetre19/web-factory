<!-- ── Carousel ── -->
<!-- CarouselContext.Provider -->
      <div class="relative {class}" role="region" aria-roledescription="carousel" data-slot="carousel">
        {children}
      </div>
    <!-- /CarouselContext.Provider -->

<!-- ── CarouselContent ── -->
<div ref="{carouselRef}" data-slot="carousel-content" class="overflow-hidden">
      <div class="flex {horizontal|-ml-4|-mt-4 flex-col} {class}"></div>
    </div>

<!-- ── CarouselItem ── -->
<div role="group" aria-roledescription="slide" data-slot="carousel-item" class="min-w-0 shrink-0 grow-0 basis-full {horizontal|pl-4|pt-4} {class}"></div>

<!-- ── CarouselPrevious ── -->

<!-- call-site children -->
      <!-- <ArrowLeft > external component --><!-- </ArrowLeft> -->
      <span class="sr-only">Previous slide</span>
