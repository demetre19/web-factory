<!-- ── Empty ── -->
<div data-slot="empty" class="flex min-w-0 flex-1 flex-col items-center justify-center gap-6 rounded-lg border-dashed p-6 text-center text-balance md:p-12 {class}"></div>

<!-- ── EmptyHeader ── -->
<div data-slot="empty-header" class="flex max-w-sm flex-col items-center gap-2 text-center {class}"></div>

<!-- ── EmptyMedia ── -->
<div data-slot="empty-icon" data-variant="{variant}" class="mb-2 flex shrink-0 items-center justify-center [&_svg]:pointer-events-none [&_svg]:shrink-0 bg-transparent"></div>

<!-- ── EmptyTitle ── -->
<div data-slot="empty-title" class="text-lg font-medium tracking-tight {class}"></div>

<!-- ── EmptyDescription ── -->
<div data-slot="empty-description" class="text-sm/relaxed text-muted-foreground [&>a]:underline [&>a]:underline-offset-4 [&>a:hover]:text-primary {class}"></div>

<!-- ── EmptyContent ── -->
<div data-slot="empty-content" class="flex w-full max-w-sm min-w-0 flex-col items-center gap-4 text-sm text-balance {class}"></div>
