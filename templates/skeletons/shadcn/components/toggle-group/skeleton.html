<!-- ── ToggleGroup ── -->
<div role="group" data-slot="toggle-group" data-variant="{variant}" data-size="{size}" data-spacing="{spacing}" style="{{ "--gap": spacing } as React.CSSPropert}" class="group/toggle-group flex w-fit items-center gap-[--spacing(var(--gap))] rounded-md data-[spacing=default]:data-[variant=outline]:shadow-xs {class}">
      <!-- ToggleGroupContext.Provider -->
        {children}
      <!-- /ToggleGroupContext.Provider -->
    </div>

<!-- ── ToggleGroupItem ── -->
<button type="button" aria-pressed="false" data-state="off" data-slot="toggle-group-item" data-variant="{context.variant || variant}" data-size="{context.size || size}" data-spacing="{context.spacing}" class="{…toggleVariants(…)} w-auto min-w-0 shrink-0 px-3 focus:z-10 focus-visible:z-10 data-[spacing=0]:rounded-none data-[spacing=0]:shadow-none data-[spacing=0]:first:rounded-l-md data-[spacing=0]:last:rounded-r-md data-[spacing=0]:data-[variant=outline]:border-l-0 data-[spacing=0]:data-[variant=outline]:first:border-l {class}">
      {children}
    </button>
