<!-- ── SelectGroup ── -->
<div role="group" data-slot="select-group"></div>

<!-- ── SelectValue ── -->
<span data-slot="select-value"></span>

<!-- ── SelectTrigger ── -->
<button type="button" role="combobox" aria-expanded="false" aria-controls="{listbox-id}" data-state="closed" data-slot="select-trigger" data-size="{size}" class="flex w-fit items-center justify-between gap-2 rounded-md border border-input bg-transparent px-3 py-2 text-sm whitespace-nowrap shadow-xs transition-[color,box-shadow] outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 data-[placeholder]:text-muted-foreground data-[size=default]:h-9 data-[size=sm]:h-8 *:data-[slot=select-value]:line-clamp-1 *:data-[slot=select-value]:flex *:data-[slot=select-value]:items-center *:data-[slot=select-value]:gap-2 dark:bg-input/30 dark:hover:bg-input/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&_svg:not([class*='text-'])]:text-muted-foreground {class}">
      {children}
      <svg aria-hidden="true" aria-hidden="true" data-icon="ChevronDownIcon" class="size-4 opacity-50"></svg>
    </button>

<!-- ── SelectContent ── -->
<div role="listbox" data-state="open" tabindex="-1" data-slot="select-content" class="relative z-50 max-h-(--radix-select-content-available-height) min-w-[8rem] origin-(--radix-select-content-transform-origin) overflow-x-hidden overflow-y-auto rounded-md border bg-popover text-popover-foreground shadow-md data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 {position === "popper" &&
     } {class}" position="{position}" align="{align}">
        <div aria-hidden="true" data-slot="select-scroll-up-button" class="flex cursor-default items-center justify-center py-1 {class}">
      <svg aria-hidden="true" data-icon="ChevronUpIcon" class="size-4"></svg>
    </div>
        <div class="p-1 {position === "popper" &&
     }">
          {children}
        </div>
        <div aria-hidden="true" data-slot="select-scroll-down-button" class="flex cursor-default items-center justify-center py-1 {class}">
      <svg aria-hidden="true" data-icon="ChevronDownIcon" class="size-4"></svg>
    </div>
      </div>

<!-- ── SelectLabel ── -->
<div data-slot="select-label" class="px-2 py-1.5 text-xs text-muted-foreground {class}"></div>

<!-- ── SelectItem ── -->
<div role="option" aria-selected="false" data-state="unchecked" tabindex="-1" data-slot="select-item" class="relative flex w-full cursor-default items-center gap-2 rounded-sm py-1.5 pr-8 pl-2 text-sm outline-hidden select-none focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&_svg:not([class*='text-'])]:text-muted-foreground *:[span]:last:flex *:[span]:last:items-center *:[span]:last:gap-2 {class}">
      <span data-slot="select-item-indicator" class="absolute right-2 flex size-3.5 items-center justify-center">
        <span>
          <svg aria-hidden="true" data-icon="CheckIcon" class="size-4"></svg>
        </span>
      </span>
      <span>{children}</span>
    </div>

<!-- ── SelectSeparator ── -->
<div role="separator" data-slot="select-separator" class="pointer-events-none -mx-1 my-1 h-px bg-border {class}"></div>

<!-- ── SelectScrollUpButton ── -->
<div aria-hidden="true" data-slot="select-scroll-up-button" class="flex cursor-default items-center justify-center py-1 {class}">
      <svg aria-hidden="true" data-icon="ChevronUpIcon" class="size-4"></svg>
    </div>

<!-- ── SelectScrollDownButton ── -->
<div aria-hidden="true" data-slot="select-scroll-down-button" class="flex cursor-default items-center justify-center py-1 {class}">
      <svg aria-hidden="true" data-icon="ChevronDownIcon" class="size-4"></svg>
    </div>
