<!-- ── CommandDialog ── -->
<div data-slot="dialog-header" class="sr-only flex flex-col gap-2 text-center sm:text-left {class}"></div>
<!-- call-site children -->
        <h2 data-slot="dialog-title" class="text-lg leading-none font-semibold {class}"></h2>
<!-- call-site children -->{title}
        <p data-slot="dialog-description" class="text-sm text-muted-foreground {class}"></p>
<!-- call-site children -->{description}
      
      <div data-state="open" data-slot="dialog-overlay" class="overflow-hidden p-0 {class} fixed inset-0 z-50 bg-black/50 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:animate-in data-[state=open]:fade-in-0 {class}"></div>
      <div role="dialog" aria-modal="true" aria-labelledby="{title-id}" aria-describedby="{description-id}" data-state="open" tabindex="-1" data-slot="dialog-content" class="fixed top-[50%] left-[50%] z-50 grid w-full max-w-[calc(100%-2rem)] translate-x-[-50%] translate-y-[-50%] gap-4 rounded-lg border bg-background p-6 shadow-lg duration-200 outline-none data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 sm:max-w-lg {class}">
        
        <!-- <CommandPrimitive data-slot="command" class="**:data-[slot=command-input-wrapper]:h-12 [&_[cmdk-group-heading]]:px-2 [&_[cmdk-group-heading]]:font-medium [&_[cmdk-group-heading]]:text-muted-foreground [&_[cmdk-group]]:px-2 [&_[cmdk-group]:not([hidden])_~[cmdk-group]]:pt-0 [&_[cmdk-input-wrapper]_svg]:h-5 [&_[cmdk-input-wrapper]_svg]:w-5 [&_[cmdk-input]]:h-12 [&_[cmdk-item]]:px-2 [&_[cmdk-item]]:py-3 [&_[cmdk-item]_svg]:h-5 [&_[cmdk-item]_svg]:w-5 flex h-full w-full flex-col overflow-hidden rounded-md bg-popover text-popover-foreground {class}"> external component --><!-- </CommandPrimitive> -->
<!-- call-site children -->
          {children}
        
      
        <!-- when showCloseButton --><button type="button" data-slot="dialog-close" class="absolute top-4 right-4 rounded-xs opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:ring-2 focus:ring-ring focus:ring-offset-2 focus:outline-hidden disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4">
            <svg aria-hidden="true" data-icon="XIcon"></svg>
            <span class="sr-only">Close</span>
          </button><!-- /when -->
      </div>

<!-- ── CommandInput ── -->
<div data-slot="command-input-wrapper" class="flex h-9 items-center gap-2 border-b px-3">
      <svg aria-hidden="true" data-icon="SearchIcon" class="size-4 shrink-0 opacity-50"></svg>
      <input type="text" role="combobox" aria-expanded="true" aria-autocomplete="list" autocomplete="off" data-slot="command-input" class="flex h-10 w-full rounded-md bg-transparent py-3 text-sm outline-hidden placeholder:text-muted-foreground disabled:cursor-not-allowed disabled:opacity-50 {class}">
    </div>

<!-- ── CommandList ── -->
<div role="listbox" data-slot="command-list" class="max-h-[300px] scroll-py-1 overflow-x-hidden overflow-y-auto {class}"></div>

<!-- ── CommandEmpty ── -->
<div role="presentation" data-slot="command-empty" class="py-6 text-center text-sm"></div>

<!-- ── CommandGroup ── -->
<div role="group" data-slot="command-group" class="overflow-hidden p-1 text-foreground [&_[cmdk-group-heading]]:px-2 [&_[cmdk-group-heading]]:py-1.5 [&_[cmdk-group-heading]]:text-xs [&_[cmdk-group-heading]]:font-medium [&_[cmdk-group-heading]]:text-muted-foreground {class}"></div>

<!-- ── CommandSeparator ── -->
<div role="separator" data-slot="command-separator" class="-mx-1 h-px bg-border {class}"></div>

<!-- ── CommandItem ── -->
<div role="option" aria-selected="false" data-slot="command-item" class="relative flex cursor-default items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-hidden select-none data-[disabled=true]:pointer-events-none data-[disabled=true]:opacity-50 data-[selected=true]:bg-accent data-[selected=true]:text-accent-foreground [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&_svg:not([class*='text-'])]:text-muted-foreground {class}"></div>

<!-- ── CommandShortcut ── -->
<span data-slot="command-shortcut" class="ml-auto text-xs tracking-widest text-muted-foreground {class}"></span>
