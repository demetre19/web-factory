<!-- ── Sidebar ── -->
<div data-state="{state}" data-collapsible="{state === "collapsed" ? collapsible : ""}" data-variant="{variant}" data-side="{side}" data-slot="sidebar" class="group peer hidden text-sidebar-foreground md:block">
      {/* This is what handles the sidebar gap }
      <div data-slot="sidebar-gap" class="relative w-(--sidebar-width) bg-transparent transition-[width] duration-200 ease-linear group-data-[collapsible=offcanvas]:w-0 group-data-[side=right]:rotate-180 {floating|inset|group-data-[collapsible=icon]:w-[calc(var(--sidebar-width-icon)+(--spacing(4)))]|group-data-[collapsible=icon]:w-(--sidebar-width-icon)}"></div>
      <div data-slot="sidebar-container" class="fixed inset-y-0 z-10 hidden h-svh w-(--sidebar-width) transition-[left,right,width] duration-200 ease-linear md:flex {left|left-0 group-data-[collapsible=offcanvas]:left-[calc(var(--sidebar-width)*-1)]|right-0 group-data-[collapsible=offcanvas]:right-[calc(var(--sidebar-width)*-1)]} floating" || variant === "inset"
            ? "p-2 group-data-[collapsible=icon]:w-[calc(var(--sidebar-width-icon)+(--spacing(4))+2px)]"
            : "group-data-[collapsible=icon]:w-(--sidebar-width-icon) group-data-[side=left]:border-r group-data-[side=right]:border-l {class}">
        <div data-sidebar="sidebar" data-slot="sidebar-inner" class="flex h-full w-full flex-col bg-sidebar group-data-[variant=floating]:rounded-lg group-data-[variant=floating]:border group-data-[variant=floating]:border-sidebar-border group-data-[variant=floating]:shadow-sm">
          {children}
        </div>
      </div>
    </div>

<!-- ── SidebarTrigger ── -->
<button data-slot="button" data-variant="{variant}" data-size="{size}" class="size-7 {class} inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3"></button>
<!-- call-site children -->
      <svg aria-hidden="true" data-icon="PanelLeftIcon"></svg>
      <span class="sr-only">Toggle Sidebar</span>

<!-- ── SidebarRail ── -->
<button data-sidebar="rail" data-slot="sidebar-rail" aria-label="Toggle Sidebar" tabIndex="{-1}" title="Toggle Sidebar" class="absolute inset-y-0 z-20 hidden w-4 -translate-x-1/2 transition-all ease-linear group-data-[side=left]:-right-4 group-data-[side=right]:left-0 after:absolute after:inset-y-0 after:left-1/2 after:w-[2px] hover:after:bg-sidebar-border sm:flex in-data-[side=left]:cursor-w-resize in-data-[side=right]:cursor-e-resize [[data-side=left][data-state=collapsed]_&]:cursor-e-resize [[data-side=right][data-state=collapsed]_&]:cursor-w-resize group-data-[collapsible=offcanvas]:translate-x-0 group-data-[collapsible=offcanvas]:after:left-full hover:group-data-[collapsible=offcanvas]:bg-sidebar [[data-side=left][data-collapsible=offcanvas]_&]:-right-2 [[data-side=right][data-collapsible=offcanvas]_&]:-left-2 {class}"></button>

<!-- ── SidebarInset ── -->
<main data-slot="sidebar-inset" class="relative flex w-full flex-1 flex-col bg-background md:peer-data-[variant=inset]:m-2 md:peer-data-[variant=inset]:ml-0 md:peer-data-[variant=inset]:rounded-xl md:peer-data-[variant=inset]:shadow-sm md:peer-data-[variant=inset]:peer-data-[state=collapsed]:ml-2 {class}"></main>

<!-- ── SidebarInput ── -->
<input type="{type}" data-slot="input" class="h-8 w-full bg-background shadow-none {class} h-9 w-full min-w-0 rounded-md border border-input bg-transparent px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground file:inline-flex file:h-7 file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 {class}">

<!-- ── SidebarHeader ── -->
<div data-slot="sidebar-header" data-sidebar="header" class="flex flex-col gap-2 p-2 {class}"></div>

<!-- ── SidebarFooter ── -->
<div data-slot="sidebar-footer" data-sidebar="footer" class="flex flex-col gap-2 p-2 {class}"></div>

<!-- ── SidebarSeparator ── -->
<div role="separator" data-orientation="horizontal" data-slot="separator" decorative="{decorative}" orientation="{orientation}" class="mx-2 w-auto bg-sidebar-border {class} shrink-0 bg-border data-[orientation=horizontal]:h-px data-[orientation=horizontal]:w-full data-[orientation=vertical]:h-full data-[orientation=vertical]:w-px {class}"></div>

<!-- ── SidebarContent ── -->
<div data-slot="sidebar-content" data-sidebar="content" class="flex min-h-0 flex-1 flex-col gap-2 overflow-auto group-data-[collapsible=icon]:overflow-hidden {class}"></div>

<!-- ── SidebarGroup ── -->
<div data-slot="sidebar-group" data-sidebar="group" class="relative flex w-full min-w-0 flex-col p-2 {class}"></div>

<!-- ── SidebarGroupLabel ── -->
<div data-slot="sidebar-group-label" data-sidebar="group-label" class="flex h-8 shrink-0 items-center rounded-md px-2 text-xs font-medium text-sidebar-foreground/70 ring-sidebar-ring outline-hidden transition-[margin,opacity] duration-200 ease-linear focus-visible:ring-2 [&>svg]:size-4 [&>svg]:shrink-0 group-data-[collapsible=icon]:-mt-8 group-data-[collapsible=icon]:opacity-0 {class}"></div>

<!-- ── SidebarGroupAction ── -->
<div data-slot="sidebar-group-action" data-sidebar="group-action" class="absolute top-3.5 right-3 flex aspect-square w-5 items-center justify-center rounded-md p-0 text-sidebar-foreground ring-sidebar-ring outline-hidden transition-transform hover:bg-sidebar-accent hover:text-sidebar-accent-foreground focus-visible:ring-2 [&>svg]:size-4 [&>svg]:shrink-0 after:absolute after:-inset-2 md:after:hidden group-data-[collapsible=icon]:hidden {class}"></div>

<!-- ── SidebarGroupContent ── -->
<div data-slot="sidebar-group-content" data-sidebar="group-content" class="w-full text-sm {class}"></div>

<!-- ── SidebarMenu ── -->
<ul data-slot="sidebar-menu" data-sidebar="menu" class="flex w-full min-w-0 flex-col gap-1 {class}"></ul>

<!-- ── SidebarMenuItem ── -->
<li data-slot="sidebar-menu-item" data-sidebar="menu-item" class="group/menu-item relative {class}"></li>

<!-- ── SidebarMenuButton ── -->
<button type="button" aria-describedby="{tooltip-id}" data-state="closed" data-slot="tooltip-trigger"></button>
<!-- call-site children -->{button}
      <div role="tooltip" data-state="open" data-slot="tooltip-content" sideOffset="{sideOffset}" class="z-50 w-fit origin-(--radix-tooltip-content-transform-origin) animate-in rounded-md bg-foreground px-3 py-1.5 text-xs text-balance text-background fade-in-0 zoom-in-95 data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 {class}">
        {children}
        <span aria-hidden="true" class="z-50 size-2.5 translate-y-[calc(-50%_-_2px)] rotate-45 rounded-[2px] bg-foreground fill-foreground"></span>
      </div>

<!-- ── SidebarMenuAction ── -->
<div data-slot="sidebar-menu-action" data-sidebar="menu-action" class="absolute top-1.5 right-1 flex aspect-square w-5 items-center justify-center rounded-md p-0 text-sidebar-foreground ring-sidebar-ring outline-hidden transition-transform peer-hover/menu-button:text-sidebar-accent-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground focus-visible:ring-2 [&>svg]:size-4 [&>svg]:shrink-0 after:absolute after:-inset-2 md:after:hidden peer-data-[size=sm]/menu-button:top-1 peer-data-[size=default]/menu-button:top-1.5 peer-data-[size=lg]/menu-button:top-2.5 group-data-[collapsible=icon]:hidden {showOnHover &&
          "grou} {class}"></div>

<!-- ── SidebarMenuBadge ── -->
<div data-slot="sidebar-menu-badge" data-sidebar="menu-badge" class="pointer-events-none absolute right-1 flex h-5 min-w-5 items-center justify-center rounded-md px-1 text-xs font-medium text-sidebar-foreground tabular-nums select-none peer-hover/menu-button:text-sidebar-accent-foreground peer-data-[active=true]/menu-button:text-sidebar-accent-foreground peer-data-[size=sm]/menu-button:top-1 peer-data-[size=default]/menu-button:top-1.5 peer-data-[size=lg]/menu-button:top-2.5 group-data-[collapsible=icon]:hidden {class}"></div>

<!-- ── SidebarMenuSkeleton ── -->
<div data-slot="sidebar-menu-skeleton" data-sidebar="menu-skeleton" class="flex h-8 items-center gap-2 rounded-md px-2 {class}">
      <!-- when showIcon --><div data-slot="skeleton" class="size-4 rounded-md animate-pulse rounded-md bg-accent {class}"></div><!-- /when -->
      <div data-slot="skeleton" class="h-4 max-w-(--skeleton-width) flex-1 animate-pulse rounded-md bg-accent {class}"></div>
    </div>

<!-- ── SidebarMenuSub ── -->
<ul data-slot="sidebar-menu-sub" data-sidebar="menu-sub" class="mx-3.5 flex min-w-0 translate-x-px flex-col gap-1 border-l border-sidebar-border px-2.5 py-0.5 group-data-[collapsible=icon]:hidden {class}"></ul>

<!-- ── SidebarMenuSubItem ── -->
<li data-slot="sidebar-menu-sub-item" data-sidebar="menu-sub-item" class="group/menu-sub-item relative {class}"></li>

<!-- ── SidebarMenuSubButton ── -->
<div data-slot="sidebar-menu-sub-button" data-sidebar="menu-sub-button" data-size="{size}" data-active="{isActive}" class="flex h-7 min-w-0 -translate-x-px items-center gap-2 overflow-hidden rounded-md px-2 text-sidebar-foreground ring-sidebar-ring outline-hidden hover:bg-sidebar-accent hover:text-sidebar-accent-foreground focus-visible:ring-2 active:bg-sidebar-accent active:text-sidebar-accent-foreground disabled:pointer-events-none disabled:opacity-50 aria-disabled:pointer-events-none aria-disabled:opacity-50 [&>span:last-child]:truncate [&>svg]:size-4 [&>svg]:shrink-0 [&>svg]:text-sidebar-accent-foreground data-[active=true]:bg-sidebar-accent data-[active=true]:text-sidebar-accent-foreground {size === "sm" && "text-xs"} {size === "md" && "text-sm"} group-data-[collapsible=icon]:hidden {class}"></div>
