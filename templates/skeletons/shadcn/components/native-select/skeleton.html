<!-- ── NativeSelect ── -->
<div data-slot="native-select-wrapper" class="group/native-select relative w-fit has-[select:disabled]:opacity-50">
      <select data-slot="native-select" data-size="{size}" class="h-9 w-full min-w-0 appearance-none rounded-md border border-input bg-transparent px-3 py-2 pr-9 text-sm shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground disabled:pointer-events-none disabled:cursor-not-allowed data-[size=sm]:h-8 data-[size=sm]:py-1 dark:bg-input/30 dark:hover:bg-input/50 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 {class}"></select>
      <svg aria-hidden="true" data-icon="ChevronDownIcon" class="pointer-events-none absolute top-1/2 right-3.5 size-4 -translate-y-1/2 text-muted-foreground opacity-50 select-none"></svg>
    </div>

<!-- ── NativeSelectOption ── -->
<option data-slot="native-select-option" class="bg-[Canvas] text-[CanvasText] {class}"></option>

<!-- ── NativeSelectOptGroup ── -->
<optgroup data-slot="native-select-optgroup" class="bg-[Canvas] text-[CanvasText] {class}"></optgroup>
