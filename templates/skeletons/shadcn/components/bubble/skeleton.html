<!-- ── BubbleGroup ── -->
<div data-slot="bubble-group" class="flex min-w-0 flex-col gap-2 {class}"></div>

<!-- ── Bubble ── -->
<div data-slot="bubble" data-variant="{variant}" data-align="{align}" class="group/bubble relative flex w-fit max-w-[80%] min-w-0 flex-col gap-1 group-data-[align=end]/message:self-end data-[align=end]:self-end data-[variant=ghost]:max-w-full *:data-[slot=bubble-content]:bg-primary *:data-[slot=bubble-content]:text-primary-foreground [&>[data-slot=bubble-content]:is(button,a):hover]:bg-primary/80 {class}"></div>

<!-- ── BubbleContent ── -->
<div data-slot="bubble-content" class="w-fit max-w-full min-w-0 overflow-hidden rounded-xl border border-transparent px-3 py-2 text-sm leading-relaxed wrap-break-word group-data-[align=end]/bubble:self-end [button]:text-left [button,a]:transition-colors [button,a]:outline-none [button,a]:focus-visible:border-ring [button,a]:focus-visible:ring-3 [button,a]:focus-visible:ring-ring/50 {class}"></div>

<!-- ── BubbleReactions ── -->
<div data-slot="bubble-reactions" data-align="{align}" data-side="{side}" class="absolute z-10 flex w-fit shrink-0 items-center justify-center gap-1 rounded-full bg-muted px-1.5 py-0.5 text-sm ring-3 ring-card has-[button]:p-0 bottom-0 translate-y-3/4 right-3 {class}"></div>
