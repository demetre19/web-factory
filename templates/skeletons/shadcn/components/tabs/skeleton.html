<!-- ── Tabs ── -->
<div data-orientation="{orientation}" data-slot="tabs" orientation="{orientation}" class="group/tabs flex gap-2 data-[orientation=horizontal]:flex-col {class}"></div>

<!-- ── TabsList ── -->

<!-- ── TabsContent ── -->
