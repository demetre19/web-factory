<!-- ── DropdownMenuTrigger ── -->
<button type="button" aria-haspopup="menu" aria-expanded="false" data-state="closed" data-slot="dropdown-menu-trigger"></button>

<!-- ── DropdownMenuContent ── -->
<div role="menu" data-state="open" tabindex="-1" data-slot="dropdown-menu-content" sideOffset="{sideOffset}" class="z-50 max-h-(--radix-dropdown-menu-content-available-height) min-w-[8rem] origin-(--radix-dropdown-menu-content-transform-origin) overflow-x-hidden overflow-y-auto rounded-md border bg-popover p-1 text-popover-foreground shadow-md data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 {class}"></div>

<!-- ── DropdownMenuGroup ── -->
<div role="group" data-slot="dropdown-menu-group"></div>

<!-- ── DropdownMenuItem ── -->
<div role="menuitem" tabindex="-1" data-slot="dropdown-menu-item" data-inset="{inset}" data-variant="{variant}" class="relative flex cursor-default items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-hidden select-none focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 data-[inset]:pl-8 data-[variant=destructive]:text-destructive data-[variant=destructive]:focus:bg-destructive/10 data-[variant=destructive]:focus:text-destructive dark:data-[variant=destructive]:focus:bg-destructive/20 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&_svg:not([class*='text-'])]:text-muted-foreground data-[variant=destructive]:*:[svg]:text-destructive! {class}"></div>

<!-- ── DropdownMenuCheckboxItem ── -->
<div role="menuitemcheckbox" aria-checked="false" tabindex="-1" data-slot="dropdown-menu-checkbox-item" class="relative flex cursor-default items-center gap-2 rounded-sm py-1.5 pr-2 pl-8 text-sm outline-hidden select-none focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 {class}" checked="{checked}">
      <span class="pointer-events-none absolute left-2 flex size-3.5 items-center justify-center">
        <span>
          <svg aria-hidden="true" data-icon="CheckIcon" class="size-4"></svg>
        </span>
      </span>
      {children}
    </div>

<!-- ── DropdownMenuRadioGroup ── -->
<!-- DropdownMenuPrimitive.RadioGroup --><!-- /DropdownMenuPrimitive.RadioGroup -->

<!-- ── DropdownMenuRadioItem ── -->
<div role="menuitemradio" aria-checked="false" tabindex="-1" data-slot="dropdown-menu-radio-item" class="relative flex cursor-default items-center gap-2 rounded-sm py-1.5 pr-2 pl-8 text-sm outline-hidden select-none focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 {class}">
      <span class="pointer-events-none absolute left-2 flex size-3.5 items-center justify-center">
        <span>
          <svg aria-hidden="true" data-icon="CircleIcon" class="size-2 fill-current"></svg>
        </span>
      </span>
      {children}
    </div>

<!-- ── DropdownMenuLabel ── -->
<div data-slot="dropdown-menu-label" data-inset="{inset}" class="px-2 py-1.5 text-sm font-medium data-[inset]:pl-8 {class}"></div>

<!-- ── DropdownMenuSeparator ── -->
<div role="separator" data-slot="dropdown-menu-separator" class="-mx-1 my-1 h-px bg-border {class}"></div>

<!-- ── DropdownMenuShortcut ── -->
<span data-slot="dropdown-menu-shortcut" class="ml-auto text-xs tracking-widest text-muted-foreground {class}"></span>

<!-- ── DropdownMenuSubTrigger ── -->
<div role="menuitem" aria-haspopup="menu" aria-expanded="false" tabindex="-1" data-slot="dropdown-menu-sub-trigger" data-inset="{inset}" class="flex cursor-default items-center gap-2 rounded-sm px-2 py-1.5 text-sm outline-hidden select-none focus:bg-accent focus:text-accent-foreground data-[inset]:pl-8 data-[state=open]:bg-accent data-[state=open]:text-accent-foreground [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 [&_svg:not([class*='text-'])]:text-muted-foreground {class}">
      {children}
      <svg aria-hidden="true" data-icon="ChevronRightIcon" class="ml-auto size-4"></svg>
    </div>

<!-- ── DropdownMenuSubContent ── -->
<div role="menu" data-state="open" tabindex="-1" data-slot="dropdown-menu-sub-content" class="z-50 min-w-[8rem] origin-(--radix-dropdown-menu-content-transform-origin) overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-lg data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 {class}"></div>
