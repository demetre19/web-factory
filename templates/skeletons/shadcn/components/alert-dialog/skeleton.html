<!-- ── AlertDialogTrigger ── -->
<button type="button" aria-haspopup="dialog" data-slot="alert-dialog-trigger"></button>

<!-- ── AlertDialogOverlay ── -->
<div data-state="open" data-slot="alert-dialog-overlay" class="fixed inset-0 z-50 bg-black/50 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:animate-in data-[state=open]:fade-in-0 {class}"></div>

<!-- ── AlertDialogContent ── -->
<div data-state="open" data-slot="alert-dialog-overlay" class="fixed inset-0 z-50 bg-black/50 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:animate-in data-[state=open]:fade-in-0 {class}"></div>
      <div role="alertdialog" aria-modal="true" aria-labelledby="{title-id}" aria-describedby="{description-id}" data-state="open" tabindex="-1" data-slot="alert-dialog-content" data-size="{size}" class="group/alert-dialog-content fixed top-[50%] left-[50%] z-50 grid w-full max-w-[calc(100%-2rem)] translate-x-[-50%] translate-y-[-50%] gap-4 rounded-lg border bg-background p-6 shadow-lg duration-200 data-[size=sm]:max-w-xs data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 data-[size=default]:sm:max-w-lg {class}"></div>

<!-- ── AlertDialogHeader ── -->
<div data-slot="alert-dialog-header" class="grid grid-rows-[auto_1fr] place-items-center gap-1.5 text-center has-data-[slot=alert-dialog-media]:grid-rows-[auto_auto_1fr] has-data-[slot=alert-dialog-media]:gap-x-6 sm:group-data-[size=default]/alert-dialog-content:place-items-start sm:group-data-[size=default]/alert-dialog-content:text-left sm:group-data-[size=default]/alert-dialog-content:has-data-[slot=alert-dialog-media]:grid-rows-[auto_1fr] {class}"></div>

<!-- ── AlertDialogFooter ── -->
<div data-slot="alert-dialog-footer" class="flex flex-col-reverse gap-2 group-data-[size=sm]/alert-dialog-content:grid group-data-[size=sm]/alert-dialog-content:grid-cols-2 sm:flex-row sm:justify-end {class}"></div>

<!-- ── AlertDialogTitle ── -->
<h2 data-slot="alert-dialog-title" class="text-lg font-semibold sm:group-data-[size=default]/alert-dialog-content:group-has-data-[slot=alert-dialog-media]/alert-dialog-content:col-start-2 {class}"></h2>

<!-- ── AlertDialogDescription ── -->
<p data-slot="alert-dialog-description" class="text-sm text-muted-foreground {class}"></p>

<!-- ── AlertDialogMedia ── -->
<div data-slot="alert-dialog-media" class="mb-2 inline-flex size-16 items-center justify-center rounded-md bg-muted sm:group-data-[size=default]/alert-dialog-content:row-span-2 *:[svg:not([class*='size-'])]:size-8 {class}"></div>

<!-- ── AlertDialogAction ── -->
<button data-slot="button" data-variant="{variant}" data-size="{size}" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3"></button>
<!-- call-site children -->
      <button type="button" data-slot="alert-dialog-action" class="{class}"></button>

<!-- ── AlertDialogCancel ── -->
<button data-slot="button" data-variant="{variant}" data-size="{size}" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3"></button>
<!-- call-site children -->
      <button type="button" data-slot="alert-dialog-cancel" class="{class}"></button>
