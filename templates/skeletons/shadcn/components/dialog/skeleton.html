<!-- ── DialogTrigger ── -->
<button type="button" aria-haspopup="dialog" data-slot="dialog-trigger"></button>

<!-- ── DialogClose ── -->
<button type="button" data-slot="dialog-close"></button>

<!-- ── DialogOverlay ── -->
<div data-state="open" data-slot="dialog-overlay" class="fixed inset-0 z-50 bg-black/50 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:animate-in data-[state=open]:fade-in-0 {class}"></div>

<!-- ── DialogContent ── -->
<div data-state="open" data-slot="dialog-overlay" class="fixed inset-0 z-50 bg-black/50 data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:animate-in data-[state=open]:fade-in-0 {class}"></div>
      <div role="dialog" aria-modal="true" aria-labelledby="{title-id}" aria-describedby="{description-id}" data-state="open" tabindex="-1" data-slot="dialog-content" class="fixed top-[50%] left-[50%] z-50 grid w-full max-w-[calc(100%-2rem)] translate-x-[-50%] translate-y-[-50%] gap-4 rounded-lg border bg-background p-6 shadow-lg duration-200 outline-none data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 sm:max-w-lg {class}">
        {children}
        <!-- when showCloseButton --><button type="button" data-slot="dialog-close" class="absolute top-4 right-4 rounded-xs opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:ring-2 focus:ring-ring focus:ring-offset-2 focus:outline-hidden disabled:pointer-events-none data-[state=open]:bg-accent data-[state=open]:text-muted-foreground [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4">
            <svg aria-hidden="true" data-icon="XIcon"></svg>
            <span class="sr-only">Close</span>
          </button><!-- /when -->
      </div>

<!-- ── DialogHeader ── -->
<div data-slot="dialog-header" class="flex flex-col gap-2 text-center sm:text-left {class}"></div>

<!-- ── DialogFooter ── -->
<div data-slot="dialog-footer" class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end {class}">
      {children}
      <!-- when showCloseButton --><button type="button" data-slot="button" data-variant="{variant}" data-size="{size}" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-md text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2 has-[>svg]:px-3"></button>
<!-- call-site children -->Close<!-- /when -->
    </div>

<!-- ── DialogTitle ── -->
<h2 data-slot="dialog-title" class="text-lg leading-none font-semibold {class}"></h2>

<!-- ── DialogDescription ── -->
<p data-slot="dialog-description" class="text-sm text-muted-foreground {class}"></p>
