<body class="min-h-screen bg-[#F5F4EF] text-[#151412] dark:bg-[#0D0E10] dark:text-[#F2EFEA] font-sans antialiased transition-colors duration-300">

    <button id="themeToggle" type="button" aria-label="Toggle light or dark theme" class="px-3.5 py-1.5 text-xs font-medium border border-black/15 dark:border-white/15 rounded-md hover:bg-black/5 dark:hover:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B] transition-colors">

    <div id="spotlightStage" tabindex="0" role="region" aria-label="Nocturne Gallery Inspection Stage" aria-describedby="spot-caption" class="relative h-[470px] rounded-2xl overflow-hidden border border-black/10 dark:border-white/10 cursor-crosshair focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#E07F4B]">

        <svg viewBox="0 0 900 470" preserveAspectRatio="xMidYMid slice" aria-hidden="true" class="w-full h-full">

        </svg>
        <div aria-hidden="true" class="film-grain absolute inset-0 opacity-40"></div>
      </div>

      <div id="spot-caption" class="absolute bottom-6 left-6 right-6 flex items-center justify-between text-xs font-mono text-white/85 pointer-events-none">
        <span>BERLIN · NOCTURNE ARCHIVE PLATE 17</span>
        <span id="spotCoords">LOUPE 50% · 48%</span>
      </div>
    </div>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const stage = document.getElementById('spotlightStage');
    const colorReveal = document.getElementById('colorReveal');
    const spotCoords = document.getElementById('spotCoords');

    let px = 50, py = 48;

    function updateSpot(xPct, yPct) {
      px = Math.max(5, Math.min(95, xPct));
      py = Math.max(5, Math.min(95, yPct));
      colorReveal.style.clipPath = `circle(145px at ${px.toFixed(1)}% ${py.toFixed(1)}%)`;
      spotCoords.textContent = `LOUPE ${Math.round(px)}% · ${Math.round(py)}%`;
    }

    stage.addEventListener('pointermove', (e) => {
      const r = stage.getBoundingClientRect();
      updateSpot(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
    });

    stage.addEventListener('keydown', (e) => {
      const step = 6;
      if (e.key === 'ArrowRight') { e.preventDefault(); updateSpot(px + step, py); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); updateSpot(px - step, py); }
      if (e.key === 'ArrowUp') { e.preventDefault(); updateSpot(px, py - step); }
      if (e.key === 'ArrowDown') { e.preventDefault(); updateSpot(px, py + step); }
    });
  </script>
