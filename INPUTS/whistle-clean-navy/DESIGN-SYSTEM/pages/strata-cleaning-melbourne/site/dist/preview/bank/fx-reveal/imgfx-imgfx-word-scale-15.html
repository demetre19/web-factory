  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const lookbook = [
      { label: '01 · SILHOUETTES — PLEATED WOOL', bg: 'radial-gradient(90% 70% at 62% 28%, rgba(244,210,180,0.68) 0%, transparent 58%), linear-gradient(148deg, #1b1614 0%, #5c4336 48%, #cda286 100%)', svg: '<path d="M160 520 C 185 280, 215 160, 240 135 C 265 160, 295 280, 320 520 Z" fill="#14100e" fill-opacity="0.78"/>' },

      { label: '03 · CHIAROSCURO — SILVER PRINT', bg: 'radial-gradient(90% 70% at 50% 35%, rgba(235,229,218,0.65) 0%, transparent 58%), linear-gradient(160deg, #10100f 0%, #44403a 48%, #c7bfb3 100%)', svg: '<ellipse cx="240" cy="240" rx="110" ry="165" fill="#0d0d0c" fill-opacity="0.74"/>' },
      { label: '04 · CLERESTORY — DAYLIGHT BAFFLE', bg: 'radial-gradient(90% 70% at 72% 24%, rgba(215,230,242,0.65) 0%, transparent 58%), linear-gradient(150deg, #141b22 0%, #3d5061 48%, #c4d2de 100%)', svg: '<polygon points="0,360 480,210 480,520 0,520" fill="#0f151a" fill-opacity="0.75"/>' },
      { label: '05 · SELVEDGE — INDIGO LOOM', bg: 'radial-gradient(90% 70% at 35% 28%, rgba(190,210,235,0.58) 0%, transparent 58%), linear-gradient(152deg, #111622 0%, #2b3c5c 48%, #8b9cb5 100%)', svg: '<rect x="80" y="90" width="320" height="340" fill="#0d111a" fill-opacity="0.58"/><line x1="240" y1="0" x2="240" y2="520" stroke="#dfe9f5" stroke-opacity="0.28" stroke-width="2"/>' },
      { label: '06 · MONOLITH — BASALT PLINTH', bg: 'radial-gradient(90% 70% at 60% 25%, rgba(226,216,204,0.56) 0%, transparent 58%), linear-gradient(158deg, #161615 0%, #46433e 48%, #b9b2a7 100%)', svg: '<polygon points="100,520 240,120 380,520" fill="#121211" fill-opacity="0.76"/>' }
    ];

    const giant = document.getElementById('giantPreview');
    const giantBg = document.getElementById('giantBg');
    const giantSvg = document.getElementById('giantSvg');
    const giantLabel = document.getElementById('giantLabel');

    function openFromPoint(idx, clientX, clientY) {
      const item = lookbook[idx] || lookbook[0];
      giantBg.style.background = item.bg;
      giantSvg.innerHTML = item.svg;
      giantLabel.textContent = item.label;

      const box = giant.getBoundingClientRect();
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const ox = ((clientX - (centerX - box.width / 2)) / Math.max(1, box.width)) * 100;
      const oy = ((clientY - (centerY - box.height / 2)) / Math.max(1, box.height)) * 100;

      giant.style.transformOrigin = `${Math.max(0, Math.min(100, ox)).toFixed(1)}% ${Math.max(0, Math.min(100, oy)).toFixed(1)}%`;
      giant.style.opacity = '0.92';
      giant.style.transform = 'translate(-50%, -50%) scale(1)';
    }

    function closePreview() {
      giant.style.opacity = '0';
      giant.style.transform = 'translate(-50%, -50%) scale(0.5)';
    }

    document.querySelectorAll('.word-btn').forEach((btn) => {
      const idx = Number(btn.dataset.word || 0);
      btn.addEventListener('pointerenter', (e) => openFromPoint(idx, e.clientX, e.clientY));
      btn.addEventListener('pointerleave', closePreview);
      btn.addEventListener('focus', () => {
        const r = btn.getBoundingClientRect();
        openFromPoint(idx, r.left + r.width / 2, r.top + r.height / 2);
      });
      btn.addEventListener('blur', closePreview);
    });
  </script>
