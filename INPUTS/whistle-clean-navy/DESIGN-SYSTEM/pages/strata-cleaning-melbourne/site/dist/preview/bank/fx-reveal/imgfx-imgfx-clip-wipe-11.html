  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clipStage = document.getElementById('clipStage');
    const layer2 = document.getElementById('wipeLayer2');
    const layer3 = document.getElementById('wipeLayer3');
    const wipePercent = document.getElementById('wipePercent');

    function updateClips() {
      const rect = clipStage.getBoundingClientRect();
      const total = Math.max(1, clipStage.offsetHeight - window.innerHeight);
      const p = Math.min(1, Math.max(0, -rect.top / total));

      if (reducedMotion) {
        layer2.style.clipPath = p >= 0.33 ? 'inset(0% 0 0 0)' : 'inset(100% 0 0 0)';
        layer3.style.clipPath = p >= 0.66 ? 'inset(0% 0 0 0)' : 'inset(100% 0 0 0)';
      } else {
        const p2 = Math.min(1, Math.max(0, p / 0.5));
        const p3 = Math.min(1, Math.max(0, (p - 0.5) / 0.5));
        layer2.style.clipPath = `inset(${((1 - p2) * 100).toFixed(2)}% 0 0 0)`;
        layer3.style.clipPath = `inset(${((1 - p3) * 100).toFixed(2)}% 0 0 0)`;
      }
      wipePercent.textContent = `CLIP ${Math.round(p * 100)}%`;
    }

    window.addEventListener('scroll', () => requestAnimationFrame(updateClips), { passive: true });
    updateClips();
  </script>
