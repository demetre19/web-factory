          </p>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const label = document.getElementById('themeLabel');
    function applyTheme(mode) {
      const dark = mode === 'dark';
      root.classList.toggle('dark', dark);
      label.textContent = dark ? 'Light Mode' : 'Dark Mode';
    }
    const params = new URLSearchParams(window.location.search);
    if (params.get('theme') === 'light') applyTheme('light');
    toggle.addEventListener('click', () => applyTheme(root.classList.contains('dark') ? 'light' : 'dark'));
    window.addEventListener('message', (e) => { if (e.data && e.data.type === 'set-theme') applyTheme(e.data.theme); });

    const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·/';
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const lines = document.querySelectorAll('.scramble-line');
    let animTimers = [];

    function runScramble() {
      animTimers.forEach((id) => cancelAnimationFrame(id));
      animTimers = [];

      if (reduced) {
        lines.forEach((el) => { el.textContent = el.dataset.text || ''; });
        return;
      }

      lines.forEach((el) => {
        const target = el.dataset.text || '';
        const duration = 560;
        const start = performance.now();

        function step(now) {
          const progress = Math.min(1, (now - start) / duration);
          const lockedCount = Math.floor(progress * target.length);
          let out = '';
          for (let i = 0; i < target.length; i++) {
            const ch = target[i];
            if (ch === ' ' || i < lockedCount) {
              out += ch;
            } else {
              out += GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
            }
          }
          el.textContent = out;
          if (progress < 1) {
            animTimers.push(requestAnimationFrame(step));
          } else {
            el.textContent = target;
          }
        }
        animTimers.push(requestAnimationFrame(step));
      });
    }

    const hero = document.getElementById('heroStage');
    const retrigger = document.getElementById('retriggerBtn');
    hero.addEventListener('pointerenter', runScramble);
    hero.addEventListener('focus', runScramble);
    retrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      runScramble();
    });

    runScramble();
  </script>
